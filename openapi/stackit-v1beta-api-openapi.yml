    VolumeAutomationExecutionErrorExample:
      summary: Error Execution
      value:
        automation:
          config:
            description: Creates daily snapshots for all volumes with specified label
            input:
              inheritVolumeLabels: false
              kind: VolumeRecoveryPointManagement
              recoveryPointLabels:
                key1: value1
                key2: value2
              snapshotRetentionPolicy:
                kind: count
                value: 2
              volumeLabelSelector: myLabelkey1=myLabelValue,myLabelKey2=myOtherLabelValue
            name: My Daily Volume Snapshot Creation Automation
            output:
              steps:
              - name: Get Volumes IDs with Label
                result:
                  kind: GetVolumeIDsResult
                  volumeIDs: []
              - name: Create Snapshots for Volume IDs
                result:
                  createdSnapshotIDs: []
                  kind: CreateSnapshotsResult
            templateId: 62c5178a-87fb-437f-88c8-c6f26b3ee4f6
            triggers:
              schedule:
                rrule: 'DTSTART;TZID=Europe/Sofia:20200803T023000

                  RRULE:FREQ=DAILY;INTERVAL=1'
          output:
            steps:
            - message: 'Collected Volume IDs: 47caf122-7dcc-435a-8125-b616341b89b2'
              name: Get Volumes IDs with Label
              result:
                kind: GetVolumeIDsResult
                volumeIDs:
                - 47caf122-7dcc-435a-8125-b616341b89b2
              status: SUCCESSFUL
            - message: Failed to create Volume Snapshots
              name: Create Snapshots for Volume IDs
              status: FAILED
        createTime: '2025-07-21T17:32:28Z'
        endTime: '2025-07-21T21:40:28Z'
        id: 1263fd13-be86-4fe4-a2aa-ef5526c607cd
        startTime: '2025-07-21T21:32:28Z'
        status: ERROR

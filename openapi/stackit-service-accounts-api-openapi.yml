openapi: 3.2.0
info:
  title: Stackit Service Accounts API
  version: '2.0'
  termsOfService: https://stackit.de/en/imprint
  x-refined-note:
  - x-source differs across the merged source definitions and was not carried
  description: 'Operations tagged Service Accounts across 2 of this provider''s published API definitions: stackit-service-account-v2.json, stackit-service-account-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://service-account.api.stackit.cloud
  variables:
    region:
      default: global
tags:
- name: Service Accounts
paths:
  /v2/service-accounts/public/jwk/{serviceAccountEmail}:
    parameters:
    - description: The email of the service account.
      in: path
      name: serviceAccountEmail
      required: true
      schema:
        format: email
        type: string
    get:
      operationId: GetJWKS
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JWKS'
          description: OK
      summary: Get JSON Web Key set of the service account
      x-stackit-authorization:
        disabled: true
      tags:
      - Service Accounts
    servers:
    - url: https://service-account.api.stackit.cloud
      variables:
        region:
          default: global
components:
  schemas:
    JWKS:
      properties:
        keys:
          items:
            $ref: '#/components/schemas/JWK'
          type: array
      required:
      - keys
      title: GetJWKResponseBody
      type: object
    JWK:
      description: JSON Web Key according to https://datatracker.ietf.org/doc/html/rfc7517#section-4
      properties:
        alg:
          type: string
        e:
          type: string
        kid:
          type: string
        ks:
          type: string
        n:
          type: string
        ops:
          type: string
        use:
          type: string
        x5c:
          type: string
        x5t:
          type: string
        x5t256:
          type: string
        x5u:
          type: string
      required:
      - n
      - e
      title: JsonWebKey
      type: object

openapi: 3.2.0
info:
  title: Stackit V1beta API
  x-refined-note:
  - x-source differs across the merged source definitions and was not carried
  version: '1.0'
  description: 'Operations tagged V1beta across 15 of this provider''s published API definitions: stackit-alb-waf-v1beta.json, stackit-automation-v1beta.json, stackit-dremio-v1beta.json, stackit-git-v1beta.json, stackit-intake-v1beta.json, stackit-logs-v1beta.json, stackit-pubsub-v1beta.json, stackit-run-command-v1beta.json, stackit-sfs-v1beta.json, stackit-telemetry-link-v1beta.json, stackit-telemetry-router-v1beta.json, stackit-dremio-openapi.yml, stackit-git-openapi.yml, stackit-intake-openapi.yml, stackit-pubsub-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://alb-waf.api.stackit.cloud
  variables:
    region:
      default: global
- url: https://automation-service.api.stackit.cloud
  variables:
    region:
      default: global
- url: https://dremio.api.{region}stackit.cloud
  variables:
    region:
      default: eu01.
      enum:
      - eu01.
- url: https://git.api.stackit.cloud
  variables:
    region:
      default: global
- url: https://intake.api.stackit.cloud
  variables:
    region:
      default: global
- url: https://logs.api.stackit.cloud
  variables:
    region:
      default: global
- url: https://pubsub.api.stackit.cloud
  variables:
    region:
      default: global
- url: https://run-command.api.{region}stackit.cloud
  variables:
    region:
      default: eu01.
      enum:
      - eu01.
- url: https://sfs.api.stackit.cloud
  variables:
    region:
      default: global
- url: https://telemetry-link.api.stackit.cloud
  variables:
    region:
      default: global
- url: https://telemetry-router.api.stackit.cloud
  variables:
    region:
      default: global

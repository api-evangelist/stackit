  /v1beta1/projects/{projectId}/regions/{region}/gateways:
    get:
      description: 'Retrieve a list of all VPN gateways in a project.

        Filter the results using the `label_selector` query parameter.'
      operationId: ListGateways
      parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
      - in: path
        name: region
        required: true
        schema:
          $ref: '#/components/schemas/Region'
      - description: Filter resources by labels.
        example: ?label_selector[environment]=production&label_selector[foo]=bar
        in: query
        name: label_selector
        schema:
          $ref: '#/components/schemas/LabelSelector'
        style: deepObject
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayList'
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: List VPN gateways in a project with label filtering
      x-stackit-authorization:
        actions:
        - vpn.gateway.list
        resource-id: projectId
        resource-id-type: dynamic
        resource-type: project
      tags:
      - V1beta1
      security:
      - bearerAuth: []
    post:
      description: Provision a new VPN gateway.
      operationId: CreateGateway
      parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
      - in: path
        name: region
        required: true
        schema:
          $ref: '#/components/schemas/Region'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGatewayPayload'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayResponse'
          description: Created
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Create a VPN gateway in a project
      x-stackit-authorization:
        actions:
        - vpn.gateway.create
        resource-id: projectId
        resource-id-type: dynamic
        resource-type: project
      tags:
      - V1beta1
      security:
      - bearerAuth: []
    servers:
    - url: https://vpn.api.stackit.cloud
      variables:
        region:
          default: global
  /v1beta1/projects/{projectId}/regions/{region}/gateways/{gatewayId}:
    delete:
      description: 'Permanently remove a VPN gateway and all its associated connections.

        This operation is irreversible.'
      operationId: DeleteGateway
      parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
      - in: path
        name: region
        required: true
        schema:
          $ref: '#/components/schemas/Region'
      - in: path
        name: gatewayId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          description: Request has been accepted. The task of deletion was initiated.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':

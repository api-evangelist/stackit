openapi: 3.2.0
info:
  title: Stackit V3alpha1 API
  version: 3alpha1
  x-refined-note:
  - x-deprecated differs across the merged source definitions and was not carried
  description: 'Operations tagged V3alpha1 across 3 of this provider''s published API definitions: stackit-pim-v3alpha1.json, stackit-postgres-flex-v3alpha1.json, stackit-sqlserverflex-v3alpha1.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://pim.api.stackit.cloud
  variables:
    region:
      default: global
- url: https://postgres-flex-service.api.stackit.cloud
  variables:
    region:
      default: global
- url: https://mssql-flex-service.api.{region}stackit.cloud

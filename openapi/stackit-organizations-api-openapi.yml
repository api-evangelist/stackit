components:
  schemas:
    NetworkAreaIPv4:
      allOf:
      - $ref: '#/components/schemas/Area'
      - $ref: '#/components/schemas/AreaPrefixConfigIPv4'
      description: The IPv4 properties of a network area.
    Resource:
      description: 'Object that represents a resource type.

        Possible values: `BACKUP`, `IMAGE`, `NETWORK`, `NETWORKAREA`, `NIC`, `PROJECT`, `ROUTE`, `SERVER`, `SERVICEACCOUNT`, `SNAPSHOT`, `VIRTUALIP`, `VOLUME`, `VPC`, `VPCNETWORKRANGE`.'
      example: SERVER
      type: string
    RouteListResponse:
      description: Route list response.
      properties:
        items:
          $ref: '#/components/schemas/RouteList'
      required:
      - items
      type: object
    UpdateNetworkAreaRoutePayload:
      description: Object that represents the request body for a route update.
      properties:
        labels:
          $ref: '#/components/schemas/Labels'
      type: object
    CreateAreaIPv4:
      allOf:
      - $ref: '#/components/schemas/AreaConfig'
      - $ref: '#/components/schemas/AreaPrefixConfigIPv4'
      description: The config object for a IPv4 network area.
    UUID:
      description: Universally Unique Identifier (UUID).
      example: d61a8564-c8dd-4ffb-bc15-143e7d0c85ed
      format: uuid
      maxLength: 36
      minLength: 36
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      type: string
    AreaMaxPrefixLengthIPv4:
      description: The maximal prefix length for networks in the network area.
      example: 29
      maximum: 29
      minimum: 24
      type: integer
    Route:
      description: Object represents a network route.
      properties:
        createdAt:
          allOf:
          - $ref: '#/components/schemas/CreatedAt'
          readOnly: true
        labels:
          $ref: '#/components/schemas/Labels'
        nexthop:
          $ref: '#/components/schemas/IP'
        prefix:
          $ref: '#/components/schemas/CIDR'
        routeId:
          allOf:
          - $ref: '#/components/schemas/UUID'
          readOnly: true
        updatedAt:
          allOf:
          - $ref: '#/components/schemas/UpdatedAt'
          readOnly: true
      required:
      - prefix
      - nexthop
      type: object
    NetworkRangeList:
      description: A list of network ranges.
      items:
        $ref: '#/components/schemas/NetworkRange'
      maxItems: 64
      minItems: 1
      type: array
    UpdateAreaIPv4:
      description: The update object for a IPv4 network area.
      properties:
        defaultNameservers:
          items:
            $ref: '#/components/schemas/IP'
          maxItems: 3
          type: array
          x-stackit-logging: true
        defaultPrefixLen:
          $ref: '#/components/schemas/AreaDefaultPrefixLengthIPv4'
        maxPrefixLen:
          $ref: '#/components/schemas/AreaMaxPrefixLengthIPv4'
        minPrefixLen:
          $ref: '#/components/schemas/AreaMinPrefixLengthIPv4'
      type: object
    AreaConfig:
      description: The basic network area object.
      properties:
        defaultNameservers:
          items:
            $ref: '#/components/schemas/IP'
          maxItems: 3
          type: array
          x-stackit-logging: true
        networkRanges:
          $ref: '#/components/schemas/NetworkRangeList'
        routes:
          $ref: '#/components/schemas/RouteList'
        transferNetwork:
          $ref: '#/components/schemas/CIDR'
      required:
      - transferNetwork
      - networkRanges
      type: object
    AreaPrefixConfigIPv4:

openapi: 3.2.0
info:
  title: Stackit Regions API
  x-refined-note:
  - x-source differs across the merged source definitions and was not carried
  version: '1.0'
  description: 'Operations tagged Regions across 15 of this provider''s published API definitions: stackit-alb-v2.json, stackit-iaas-v2.json, stackit-model-serving-v1.json, stackit-sfs-v1.json, stackit-ske-v2.json, stackit-ufw-v1.json, stackit-vpn-v1.json, stackit-alb-openapi.yml, stackit-iaas-openapi.yml, stackit-load-balancer-openapi.yml, stackit-model-serving-openapi.yml, stackit-sfs-openapi.yml, stackit-ske-openapi.yml, stackit-ufw-openapi.yml, stackit-vpn-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://alb.api.stackit.cloud
  variables:
    region:
      default: global
- url: https://iaas.api.stackit.cloud
  variables:
    region:
      default: global
- url: https://model-serving.api.stackit.cloud
  variables:
    region:
      default: global
- url: https://sfs.api.stackit.cloud
  variables:
    region:
      default: global
- url: https://ske.api.stackit.cloud
  variables:
    region:
      default: global
- url: https://ufw.api.stackit.cloud
  variables:
    region:
      default: global
- url: https://vpn.api.stackit.cloud
  variables:
    region:
      default: global
- url: https://load-balancer.api.stackit.cloud
  variables:
    region:
      default: global
tags:
- name: Regions
paths:
  /v2/regions/{region}/plans:
    get:
      description: Lists the configured service plans for a project.
      operationId: ListPlans
      parameters:
      - in: path
        name: region
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPlansResponse'
          description: OK
        '400':
          description: One or more fields are invalid.
        '401':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Status'
          description: Unauthorized
        '403':
          description: this projectId is not allowed to try this API
        '500':
          description: internal error - please retry again later or contact support if the issue persists
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
          description: Default error response
      summary: List available service plans
      x-stackit-authorization:
        disabled: true
      tags:
      - Regions
      security:
      - bearerAuth: []
    servers:
    - url: https://alb.api.stackit.cloud
      variables:
        region:
          default: global
  /v2/regions/{region}/availability-zones:
    parameters:
    - $ref: '#/components/parameters/v1Region'
    get:
      description: Get a list of all availability zones.
      operationId: ListAvailabilityZones
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityZoneListResponse'
          description: Get a list of availability zones.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: List all availability zones
      x-stackit-authorization:
        disabled: true
      tags:
      - Regions
    servers:
    - url: https://iaas.api.stackit.cloud
      variables:
        region:
          default: global
  /v1/regions/{regionId}/chat/models/{modelId}:
    parameters:
    - $ref: '#/components/parameters/regionId'
    - $ref: '#/components/parameters/modelId'
    get:
      operationId: GetChatModel
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetChatModelResponse'
          description: OK
        '400':
          $ref: '#/components/responses/BadRequestResp'
        '401':
          $ref: '#/components/responses/UnauthorizedResp'
        '500':
          $ref: '#/components/responses/InternalServerErrorResp'
      summary: details of a llm model
      x-stackit-authorization:
        disabled: true
      tags:
      - Regions
    servers:
    - url: https://model-serving.api.stackit.cloud
      variables:
        region:
          default: global
  /v1/regions/{regionId}/embedding/models/{modelId}:
    parameters:
    - $ref: '#/components/parameters/regionId'
    - $ref: '#/components/parameters/modelId'
    get:
      operationId: GetEmbeddingModel
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetEmbeddingsModelResp'
          description: OK
        '400':
          $ref: '#/components/responses/BadRequestResp'
        '401':
          $ref: '#/components/responses/UnauthorizedResp'
        '500':
          $ref: '#/components/responses/InternalServerErrorResp'
      summary: details of an embedding model
      x-stackit-authorization:
        disabled: true
      tags:
      - Regions
    servers:
    - url: https://model-serving.api.stackit.cloud
      variables:
        region:
          default: global
  /v1/regions/{regionId}/models:
    parameters:
    - $ref: '#/components/parameters/regionId'
    get:
      operationId: ListModels
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListModelsResponse'
          description: OK
        '400':
          $ref: '#/components/responses/BadRequestResp'
        '401':
          $ref: '#/components/responses/UnauthorizedResp'
        '500':
          $ref: '#/components/responses/InternalServerErrorResp'
      summary: List of shared model
      x-stackit-authorization:
        disabled: true
      tags:
      - Regions
    servers:
    - url: https://model-serving.api.stackit.cloud
      variables:
        region:
          default: global
  /v1/regions/{region}/project/{projectId}/locks:
    delete:
      description: Clean up locks for a project so that it can be deleted successfully.
      operationId: DisableLock
      parameters:
      - in: path
        name: region
        required: true
        schema:
          type: string
      - in: path
        name: projectId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisableLockResponse'
          description: OK
        '409':
          $ref: '#/components/responses/ConflictError'
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
          description: Default error response
      x-stackit-authorization:
        actions:
        - file-storage.resource-pool.create
        resource-id: projectId
        resource-id-type: dynamic
        resource-type: project
      tags:
      - Regions
      security:
      - BearerAuth: []
      summary: Disable lock
      x-summary-source: derived
    get:
      description: Get lock status for a project.
      operationId: GetLock
      parameters:
      - in: path
        name: region
        required: true
        schema:
          type: string
      - in: path
        name: projectId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetLockResponse'
          description: OK
      x-stackit-authorization:
        actions:
        - file-storage.resource-pool.create
        resource-id: projectId
        resource-id-type: dynamic
        resource-type: project
      tags:
      - Regions
      security:
      - BearerAuth: []
      summary: Get lock
      x-summary-source: derived
    post:
      description: Enable Lock for a project. Necessary for immutable snapshots and to prevent accidental deletion of resources.
      operationId: EnableLock
      parameters:
      - in: path
        name: region
        required: true
        schema:
          type: string
      - in: path
        name: projectId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnableLockResponse'
          description: OK
        '409':
          $ref: '#/components/responses/ConflictError'
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
          description: Default error response
      x-stackit-authorization:
        actions:
        - file-storage.resource-pool.create
        resource-id: projectId
        resource-id-type: dynamic
        resource-type: project
      tags:
      - Regions
      security:
      - BearerAuth: []
      summary: Enable lock
      x-summary-source: derived
    servers:
    - url: https://sfs.api.stackit.cloud
      variables:
        region:
          default: global
  /v2/regions/{region}/provider-options:
    get:
      description: Returns available Kubernetes versions, availability zones, machine types, OS versions and volume types for the cluster nodes.
      operationId: ListProviderOptions
      parameters:
      - in: path
        name: region
        required: true
        schema:
          type: string
      - in: query
        name: versionState
        schema:
          enum:
          - SUPPORTED
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderOptions'
          description: Request handled successfully
        '400':
          content:
            application/json:
              schema:
                type: object
          description: Invalid request
        '401':
          content:
            application/json:
              schema:
                type: object
          description: Unauthorized
      summary: List provider options
      x-stackit-authorization:
        disabled: true
      tags:
      - Regions
      security:
      - bearerAuth: []
    servers:
    - url: https://ske.api.stackit.cloud
      variables:
        region:
          default: global
  /v1/regions/{regionId}/provider-options:
    parameters:
    - $ref: '#/components/parameters/regionId_2'
    get:
      description: Returns a list of supported configuration options for this region.
      operationId: getV1RegionsByRegionIdProviderOptions
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderOptionsResponse'
          description: Successful response
        '400':
          $ref: '#/components/responses/badRequest'
        '401':
          $ref: '#/components/responses/unauthorized'
        '500':
          $ref: '#/components/responses/internalServerError'
      security:
      - BearerAuth: []
      summary: Get Provider Options
      x-stackit-authorization:
        disabled: true
      tags:
      - Regions
      x-operation-id-source: normalized
      x-operation-id-original: ListProviderOptions
    servers:
    - url: https://ufw.api.stackit.cloud
      variables:
        region:
          default: global
  /v1/regions/{region}/plans:
    get:
      description: 'Retrieve a list of available service plans available for provisioning a VPN in a specific `region`.

        Use this to identify the `planId` required for gateway creation.'
      operationId: getV1RegionsByRegionPlans
      parameters:
      - in: path
        name: region
        required: true
        schema:
          $ref: '#/components/schemas/Region'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanList'
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest_2'
        '401':
          $ref: '#/components/responses/Unauthorized_2'
      summary: List available service plans for a project
      x-stackit-authorization:
        disabled: true
      tags:
      - Regions
      security:
      - bearerAuth: []
      x-operation-id-source: normalized
      x-operation-id-original: ListPlans
    servers:
    - url: https://vpn.api.stackit.cloud
      variables:
        region:
          default: global
components:
  schemas:
    GoogleProtobufAny:
      additionalProperties: true
      description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message.
      properties:
        '@type':
          description: The type of the serialized message.
          type: string
      type: object
    Status:
      description: 'The `Status` type defines a logical error model that is suitable for different programming environments, including REST APIs and RPC APIs. It is used by [gRPC](https://github.com/grpc). Each `Status` message contains three pieces of data: error code, error message, and error details. You can find out more about this error model and how to work with it in the [API Design Guide](https://cloud.google.com/apis/design/errors).'
      properties:
        code:
          description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
          format: int32
          type: integer
        details:
          description: A list of messages that carry the error details.  There is a common set of message types for APIs to use.
          items:
            $ref: '#/components/schemas/GoogleProtobufAny'
          type: array
        message:
          description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
          type: string
      type: object
    ListPlansResponse:
      properties:
        validPlans:
          description: List of available service plans.
          items:
            $ref: '#/components/schemas/PlanDetails'
          type: array
      type: object
    PlanDetails:
      properties:
        description:
          description: Description
          example: Description for p10
          type: string
        flavorName:
          description: Flavor Name
          example: t1.2
          type: string
        maxConnections:
          description: Maximum number of concurrent connections per Application Load Balancer VM instance.
          format: int32
          title: Application Load Balancer max supported connections
          type: integer
        name:
          description: Service Plan Name
          example: Essential-Network-Load-Balancer-10-EU01
          type: string
        planId:
          description: Service Plan Identifier
          example: p10
          type: string
        region:
          description: Region this Plan is available in
          example: eu01
          type: string
      type: object
    v1RegionName:
      description: Name of the region.
      example: eu01
      type: string
    AvailabilityZoneListResponse:
      description: Availability Zone list response.
      properties:
        items:
          $ref: '#/components/schemas/AvailabilityZoneList'
      required:
      - items
      type: object
    Error:
      description: Error with HTTP error code and an error message.
      properties:
        code:
          example: 404
          format: int64
          type: integer
          x-stackit-logging: true
        msg:
          $ref: '#/components/schemas/errorMessage'
      required:
      - code
      - msg
      type: object
    errorMessage:
      description: An error message.
      example: Project not found
      type: string
    AvailabilityZoneList:
      description: A list of availability zones.
      items:
        $ref: '#/components/schemas/AvailabilityZone'
      type: array
    AvailabilityZone:
      description: Object that represents an availability zone.
      example: eu01-1
      type: string
    GetChatModelResponse:
      properties:
        message:
          type: string
        model:
          $ref: '#/components/schemas/ChatModelDetails'
      required:
      - model
      type: object
    GetEmbeddingsModelResp:
      properties:
        message:
          type: string
        model:
          $ref: '#/components/schemas/EmbeddingModelDetails'
      required:
      - model
      type: object
    ListModelsResponse:
      properties:
        message:
          type: string
        models:
          items:
            $ref: '#/components/schemas/Model'
          type: array
      required:
      - models
      type: object
    EmbeddingModelDetails:
      properties:
        category:
          enum:
          - standard
          - plus
          - premium
          example: standard
          type: string
        description:
          example: An embedding model
          maxLength: 2000
          pattern: ^[0-9a-zA-Z\s.:\/\-]+$
          type: string
        displayedName:
          example: Llama 3 8B Instruct
          maxLength: 200
          minLength: 1
          pattern: ^[0-9a-zA-Z\s_-]+$
          type: string
        id:
          description: generated uuid to identify a model
          format: uuid
          type: string
        name:
          description: huggingface name
          example: meta-llama/Meta-Llama-3-8B-Instruct
          maxLength: 200
          minLength: 1
          pattern: ^[0-9a-zA-Z\s.:\/\-]+$
          type: string
        outputDimension:
          example: 8192
          format: int64
          type: integer
        region:
          example: eu01
          type: string
        skus:
          items:
            $ref: '#/components/schemas/SKU'
          type: array
        tags:
          items:
            type: string
          type: array
        url:
          description: url of the model
          example: https://api.openai-compat.model-serving.eu01.onstackit.cloud
          maxLength: 200
          minLength: 1
          pattern: ^[0-9a-zA-Z\s.:\/\-]+$
          type: string
      required:
      - id
      - name
      - displayedName
      - description
      - outputDimension
      - url
      - skus
      - category
      - region
      type: object
    SKU:
      properties:
        description:
          example: Sku for input tokens for chat models
          type: string
        id:
          example: ST-00000
          type: string
        type:
          example: input
          type: string
      required:
      - id
      type: object
    Model:
      properties:
        category:
          enum:
          - standard
          - plus
          - premium
          example: standard
          type: string
        description:
          example: A chat model
          maxLength: 2000
          pattern: ^[0-9a-zA-Z\s.:\/\-]+$
          type: string
        displayedName:
          example: Llama 3 8B Instruct
          maxLength: 200
          minLength: 1
          pattern: ^[0-9a-zA-Z\s_-]+$
          type: string
        id:
          description: generated uuid to identify a model
          format: uuid
          type: string
        name:
          description: huggingface name
          example: meta-llama/Meta-Llama-3-8B-Instruct
          maxLength: 200
          minLength: 1
          type: string
        region:
          example: eu01
          type: string
        skus:
          items:
            $ref: '#/components/schemas/SKU'
          type: array
        tags:
          items:
            type: string
          type: array
        type:
          enum:
          - chat
          - embedding
          - audio
          - image
          type: string
        url:
          description: url of the model
          example: https://api.openai-compat.model-serving.eu01.onstackit.cloud
          maxLength: 200
          minLength: 1
          type: string
      required:
      - id
      - name
      - displayedName
      - description
      - type
      - url
      - region
      - category
      - skus
      type: object
    ErrorMessageResponse:
      properties:
        error:
          type: string
        message:
          type: string
      type: object
    ChatModelDetails:
      properties:
        bits:
          enum:
          - 1
          - 2
          - 4
          - 8
          - 16
          format: int32
          type: integer
          x-enum-varnames:
          - ONE_BIT
          - TWO_BITS
          - FOUR_BITS
          - EIGHT_BITS
          - SIXTEEN_BITS
        category:
          enum:
          - standard
          - plus
          - premium
          example: standard
          type: string
        contextLength:
          format: int64
          type: integer
        description:
          example: A chat model
          maxLength: 2000
          pattern: ^[0-9a-zA-Z\s.:\/\-]+$
          type: string
        displayedName:
          example: Llama 3 8B Instruct
          maxLength: 200
          minLength: 1
          pattern: ^[0-9a-zA-Z\s_-]+$
          type: string
        id:
          description: generated uuid to identify a model
          format: uuid
          type: string
        name:
          description: huggingface name
          example: meta-llama/Meta-Llama-3-8B-Instruct
          maxLength: 200
          minLength: 1
          pattern: ^[0-9a-zA-Z\s.:\/\-]+$
          type: string
        quantizationMethod:
          enum:
          - PTQ
          - QAT
          type: string
          x-enum-descriptions:
          - Post training quanitization
          - Quantization-aware training
        region:
          example: eu01
          type: string
        size:
          description: model size in bytes
          format: int64
          type: integer
        skus:
          items:
            $ref: '#/components/schemas/SKU'
          type: array
        tags:
          items:
            type: string
          type: array
        url:
          description: url of the model
          example: https://api.openai-compat.model-serving.eu01.onstackit.cloud
          maxLength: 200
          minLength: 1
          pattern: ^[0-9a-zA-Z\s.:\/\-]+$
          type: string
      required:
      - id
      - name
      - displayedName
      - description
      - size
      - contextLength
      - tags
      - url
      - category
      - skus
      - region
      type: object
    ConflictError:
      description: Conflict error response
      example:
        detail: resource pool 'test-rp' already exists
        error_description: An error occurred
        status_code: 409
        type: storage.stackit.cloud/conflict
      properties:
        detail:
          description: Human-readable explanation of the specific problem
          example: resource pool 'test-rp' already exists
          type: string
        error_description:
          description: Human-readable string of the error that occurred
          example: An error occurred
          type: string
        status_code:
          description: The HTTP status code
          example: 409
          type: integer
        type:
          description: URI Uniquely identifies the error type. It will be in the format of storage.stackit.cloud/<error-type> e.g. storage.stackit.cloud/conflict
          example: storage.stackit.cloud/conflict
          type: string
      required:
      - detail
      - error_description
      - status_code
      - type
      type: object
    DisableLockResponse:
      type: object
    GetLockResponse:
      properties:
        lockId:
          type: string
      type: object
    EnableLockResponse:
      properties:
        lockId:
          type: string
      type: object
    MachineImage:
      example:
        name: name
        versions:
        - cri:
          - kata:
              enabled: true
            name: containerd
          - kata:
              enabled: true
            name: containerd
          expirationDate: '2000-01-23T04:56:07Z'
          state: state
          version: version
        - cri:
          - kata:
              enabled: true
            name: containerd
          - kata:
              enabled: true
            name: containerd
          expirationDate: '2000-01-23T04:56:07Z'
          state: state
          version: version
      properties:
        name:
          title: Image name
          type: string
        versions:
          items:
            $ref: '#/components/schemas/MachineImageVersion'
          type: array
      type: object
    MachineImageVersion:
      example:
        cri:
        - kata:
            enabled: true
          name: containerd
        - kata:
            enabled: true
          name: containerd
        expirationDate: '2000-01-23T04:56:07Z'
        state: state
        version: version
      properties:
        cri:
          items:
            $ref: '#/components/schemas/CRI'
          title: supported container runtimes
          type: array
        expirationDate:
          format: date-time
          type: string
        state:
          type: string
        version:
          pattern: ^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$
          title: Image version
          type: string
      type: object
    CRI:
      example:
        kata:
          enabled: true
        name: containerd
      properties:
        kata:
          $ref: '#/components/schemas/Kata'
        name:
          enum:
          - containerd
          title: Name of the cri library
          type: string
      type: object
    MachineType:
      example:
        architecture: architecture
        cpu: 0
        gpu: 1
        memory: 6
        name: name
      properties:
        architecture:
          title: architecture
          type: string
        cpu:
          format: int32
          title: number of CPU cores
          type: integer
        gpu:
          format: int32
          title: number of GPUs
          type: integer
        memory:
          format: int32
          title: memory in GiB
          type: integer
        name:
          type: string
      type: object
    ProviderOptions:
      example:
        availabilityZones:
        - name: name
        - name: name
        kubernetesVersions:
        - expirationDate: '2000-01-23T04:56:07Z'
          featureGates:
            key: featureGates
          state: state
          version: version
        - expirationDate: '2000-01-23T04:56:07Z'

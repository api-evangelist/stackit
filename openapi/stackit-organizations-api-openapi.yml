openapi: 3.2.0
info:
  title: Stackit Organizations API
  x-refined-note:
  - x-source differs across the merged source definitions and was not carried
  version: '1.0'
  description: 'Operations tagged Organizations across 9 of this provider''s published API definitions: stackit-iaas-v1.json, stackit-iaas-v2.json, stackit-resource-manager-v0.json, stackit-telemetry-link-v1.json, stackit-ufw-v1.json, stackit-iaas-openapi.yml, stackit-resource-manager-openapi.yml, stackit-telemetry-link-openapi.yml, stackit-ufw-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://iaas.api.{region}stackit.cloud
  variables:
    region:
      default: eu01.
      enum:
      - eu01.
- url: https://iaas.api.stackit.cloud
  variables:
    region:
      default: global
- url: https://resource-manager.api.stackit.cloud
  variables:
    region:
      default: global
- url: https://telemetry-link.api.stackit.cloud
  variables:
    region:
      default: global
- url: https://ufw.api.stackit.cloud
  variables:
    region:
      default: global
tags:
- name: Organizations
paths:
  /v1/organizations/{organizationId}/network-areas:
    parameters:
    - $ref: '#/components/parameters/v1OrganizationID'
    get:
      deprecated: true
      description: Get a list of all visible network areas defined in an organization.
      operationId: ListNetworkAreas
      parameters:
      - $ref: '#/components/parameters/v1LabelSelector'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkAreaListResponse'
          description: Get a list of all network areas.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: List all network areas in an organization
      x-stackit-authorization:
        actions:
        - iaas.network-area.list
        resource-id: organizationId
        resource-id-type: dynamic
        resource-type: organization
      tags:
      - Organizations
    post:
      deprecated: true
      description: Create a new network area in an organization.
      operationId: CreateNetworkArea
      requestBody:
        content:
          application/json:
            example:
              addressFamily:
                ipv4:
                  defaultNameservers:
                  - 10.1.2.10
                  defaultPrefixLen: 24
                  maxPrefixLen: 28
                  minPrefixLen: 22
                  networkRanges:
                  - prefix: 10.0.0.0/16
                  routes:
                  - nexthop: 10.1.2.10
                    prefix: 192.168.0.0/24
                  transferNetwork: 10.1.2.0/24
              labels:
                environment: production
              name: My STACKIT Internet Network Area
            schema:
              $ref: '#/components/schemas/CreateNetworkAreaPayload'
        description: Request an area creation.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkArea'
          description: Area has been successfully created.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Create new network area in an organization
      x-stackit-authorization:
        actions:
        - iaas.network-area.create
        resource-id: organizationId
        resource-id-type: dynamic
        resource-type: organization
      tags:
      - Organizations
    servers:
    - url: https://iaas.api.{region}stackit.cloud
      variables:
        region:
          default: eu01.
          enum:
          - eu01.
  /v1/organizations/{organizationId}/network-areas/{areaId}:
    parameters:
    - $ref: '#/components/parameters/v1OrganizationID'
    - $ref: '#/components/parameters/v1NetworkAreaID'
    delete:
      deprecated: true
      description: Delete an existing network area in an organization. This is only possible if no projects are using the area anymore.
      operationId: DeleteNetworkArea
      responses:
        '202':
          description: Delete request for area has been accepted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':

aid: stackit
name: STACKIT
description: STACKIT is the sovereign cloud and colocation provider of the Schwarz Group (operated by Schwarz Digits Cloud GmbH & Co. KG, Germany).
  It offers scalable, GDPR-compliant cloud services hosted in Europe -- compute, Kubernetes, storage, databases, networking, security (KMS, Secrets
  Manager), data and AI -- managed through the STACKIT Portal, documented at docs.stackit.cloud, with REST API reference at docs.api.stackit.cloud
  and open source code published in the stackitcloud GitHub organization.

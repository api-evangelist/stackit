components:
  schemas:
    acl:
      description: The ACL config for the instances API.
      properties:
        ipAllowList:
          items:
            $ref: '#/components/schemas/ipAllowListEntry'
          type: array
      type: object
    ipAllowListEntry:
      properties:
        createdAt:
          description: ISO-8601 timestamp of when the entry was created.
          format: date-time
          readOnly: true
          type: string
        description:
          description: Some description of the entry.
          maxLength: 256
          type: string
        ipRange:
          description: The IP CIDR range for the ACL entry.
          example: 192.168.1.0/24
          type: string
        updatedAt:
          description: ISO-8601 timestamp of when the entry was last updated.
          format: date-time
          readOnly: true
          type: string
        uuid:
          description: The unique identifier for the ipAllowListEntry entry. This value is immutable, used to identify entries for updates, and cannot be changed after creation.
          format: uuid
          type: string
      required:
      - ipRange
      - uuid
      type: object
    planList:
      properties:
        validPlans:
          items:
            $ref: '#/components/schemas/plan'
          type: array
      type: object
    kubernetesReleaseList:
      description: A list of compatible Kubernetes releases.
      properties:
        k8s_releases:
          description: Array of Kubernetes version strings.
          example:
          - v1.33.0
          - v1.33.1
          items:
            example: v1.33.0
            type: string
          type: array
      required:
      - k8s_releases
      type: object
    tokenRaw:
      description: The token for the instance.
      type: string
    update-instance-by-namePayload:
      properties:
        description:
          description: A user chosen description to distinguish multiple instances.
          maxLength: 256
          type: string
        planId:
          description: Service Plan configures the size of the Instance.
          format: uuid
          type: string
    plan:
      properties:
        description:
          description: Description
          example: Description for Service Plan
          type: string
        id:
          description: Service Plan Identifier
          format: uuid
          type: string
        maxEdgeHosts:
          description: Maximum number of EdgeHosts
          format: int32
          title: Instance max supported EdgeHosts
          type: integer
        minEdgeHosts:
          description: Minimum number of EdgeHosts charged
          format: int32
          title: Instance min supported EdgeHosts
          type: integer
        name:
          description: Service Plan Name
          example: S
          type: string
      type: object
    instance:
      properties:
        acl:
          $ref: '#/components/schemas/acl'
        created:
          description: The date and time the creation of the instance was triggered.
          format: date-time
          type: string
        description:
          description: A user chosen description to distinguish multiple instances.
          maxLength: 256
          type: string
        displayName:
          description: The displayed name of the instance.
          format: hostname
          maxLength: 8
          type: string
        frontendUrl:
          description: URL to the Management UI of the Instance.
          format: url
          type: string
        id:
          description: A auto generated unique id which identifies the instance.
          format: hostname
          maxLength: 16
          type: string
        planId:
          description: Service Plan configures the size of the Instance.
          format: uuid
          type: string
        status:
          description: The current status of the instance.
          enum:
          - error
          - reconciling
          - active
          - deleting
          type: string
      required:
      - id
      - displayName
      - planId
      - frontendUrl
      - status
      - created
    kubeconfigRaw:
      additionalProperties: true
      description: The kubeconfig for the instance.
      type: object
    token:
      properties:
        token:
          $ref: '#/components/schemas/tokenRaw'
      required:
      - token
      type: object
    kubeconfig:
      properties:
        kubeconfig:
          $ref: '#/components/schemas/kubeconfigRaw'
      required:
      - kubeconfig
      type: object
    CreateInstancePayload:
      properties:
        description:
          description: A user chosen description to distinguish multiple instances.
          maxLength: 256
          type: string
        displayName:
          description: The displayed name to distinguish multiple instances.
          format: hostname
          maxLength: 8
          minLength: 4
          type: string
        planId:
          description: Service Plan configures the size of the Instance.
          format: uuid
          type: string
      required:
      - displayName
      - planId
    unauthorizedRequest:
      properties:
        code:
          example: '401'
          type: string
        message:
          example: Authorization failed
          type: string
      type: object
    update-instancePayload:
      properties:
        description:
          description: A user chosen description to distinguish multiple instances.
          maxLength: 256
          type: string
        planId:
          description: Service Plan configures the size of the Instance.
          format: uuid
          type: string
    badRequest:
      properties:
        code:
          example: '400'
          type: string
        message:
          example: Bad request
          type: string
      type: object
    instanceList:
      properties:
        instances:
          items:
            $ref: '#/components/schemas/instance'
          type: array
      required:
      - instances
    Plan:
      properties:
        maxBandwidth:
          description: The maximum throughput supported by the gateway in each direction, measured in MBit/s
          example: 1000
          format: int32
          type: integer
        maxConnections:
          description: The maximum number of connections supported by the VPN Gateway.
          example: 5
          format: int32
          type: integer
        name:
          description: The name of the service plan.
          example: VPN-IPSec-1000-HA-EU01
          type: string
        planId:
          $ref: '#/components/schemas/PlanID'
        sku:
          description: The SKU identifier used for billing.
          example: ST-0174901
          type: string
      type: object
    ConnectionList:
      properties:
        connections:
          items:
            $ref: '#/components/schemas/ConnectionResponse'
          type: array
      required:
      - connections
      type: object
    RoutingType:
      description: Once the gateway is created, it is not possible to change this attribute.
      enum:
      - POLICY_BASED
      - ROUTE_BASED
      - BGP_ROUTE_BASED
      type: string
    CreateGatewayPayload:
      properties:
        availabilityZones:
          properties:
            tunnel1:
              $ref: '#/components/schemas/AvailabilityZone'
            tunnel2:
              $ref: '#/components/schemas/AvailabilityZone'
          required:
          - tunnel1
          - tunnel2
          type: object
        bgp:
          $ref: '#/components/schemas/BGPGatewayConfig'
        displayName:
          description: A user-friendly name for the VPN gateway.
          example: my-vpn
          pattern: ^[a-zA-Z0-9]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?$
          type: string
        labels:
          $ref: '#/components/schemas/Label'
        networkConfig:
          $ref: '#/components/schemas/NetworkConfig'
        planId:
          description: The service plan identifier.
          example: p1000
          type: string
        routingType:
          $ref: '#/components/schemas/RoutingType'
      required:
      - displayName
      - planId
      - availabilityZones
      - routingType
      type: object
    VPNTunnels:
      description: Status of the underlying tunnel instances.
      properties:
        bgpStatus:
          $ref: '#/components/schemas/BGPStatus'
        instanceState:
          $ref: '#/components/schemas/GatewayStatus'
        internalNextHopIP:
          description: The IPv4 address of the endpoint in the SNA.
          example: 10.0.2.1
          type: string
        name:
          enum:
          - tunnel1
          - tunnel2
          type: string
        publicIP:
          description: The public IPv4 address of this endpoint.
          example: 192.214.168.197
          type: string
      type: object
    GatewayList:
      properties:
        gateways:
          items:
            $ref: '#/components/schemas/GatewayResponse'
          type: array
      required:
      - gateways
      type: object
    BGPStatusPeers:
      properties:
        localAs:
          description: The ASN of the local STACKIT gateway.
          example: 65521
          format: int64
          type: integer
        peerUptime:
          description: Duration the session has been established
          example: 00:36:41
          type: string
        pfxRcd:
          description: Count of prefixes received from the neighbor.
          example: 1
          format: int32
          type: integer
        pfxSnt:
          description: Count of prefixes advertised to the neighbor.
          example: 2
          format: int32
          type: integer
        remoteAs:
          description: The ASN of the remote neighbor.
          example: 65510
          format: int64
          type: integer
        remoteIP:
          description: The IP address of the remote BGP neighbor.
          example: 169.254.179.245
          type: string
        state:
          description: The current BGP session state.
          example: Established
          type: string
      required:
      - remoteIP
      - remoteAs
      - localAs
      - peerUptime
      - pfxRcd
      - pfxSnt
      - state
      type: object
    GatewayStatus:
      description: 'The current lifecycle state of the gateway infrastructure.

        - `PENDING`: Provisioning or update is in progress.

        - `READY`: The gateway is fully operational.

        - `ERROR`: A failure occurred.

        - `DELETING`: The resource is being removed.

        '
      enum:
      - PENDING
      - READY
      - ERROR
      - DELETING
      example: READY
      type: string
    Phase2Status:
      properties:
        bytesIn:
          description: The total data volume received through this Security Association, measured in bytes.
          example: '453533'
          type: string
        bytesOut:
          description: The total data volume sent through this Security Association, measured in bytes.
          example: '46459064'
          type: string
        dhGroup:
          description: The negotiated Diffie-Hellman Group
          example: MODP2048
          type: string
        encap:
          description: Indicates whether NAT traversal encapsulation is active for the connection.
          example: 'yes'
          type: string
        encryptionAlgorithm:
          description: The negotiated encryption algorithm.

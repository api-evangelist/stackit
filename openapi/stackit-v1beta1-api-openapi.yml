openapi: 3.2.0
info:
  title: Stackit V1beta1 API
  version: 1beta1
  x-refined-note:
  - x-source differs across the merged source definitions and was not carried
  description: 'Operations tagged V1beta1 across 3 of this provider''s published API definitions: stackit-edge-v1beta1.json, stackit-vpn-v1beta1.json, stackit-edge-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://edge.api.stackit.cloud
  variables:
    region:
      default: global
- url: https://vpn.api.stackit.cloud
  variables:
    region:
      default: global
tags:
- name: V1beta1
paths:
  /v1beta1/listcompatiblekubernetesreleases:
    parameters:
    - description: The name of the Talos release.
      in: query
      name: talosVersion
      required: true
      schema:
        type: string
    get:
      operationId: list-compatible-kubernetes-releases
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/kubernetesReleaseList'
          description: Successful response with all compatible kubernetes releases.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/badRequest'
          description: Bad request
        '404':
          description: The given Talos release was not found.
        '500':
          description: Internal server error. The application experienced some unexpected situation.
      x-stackit-authorization:
        disabled: true
      tags:
      - V1beta1
      summary: List compatible kubernetes releases
      x-summary-source: derived
    servers:
    - url: https://edge.api.stackit.cloud
      variables:
        region:
          default: global
  /v1beta1/projects/{projectId}/plans:
    parameters:
    - description: The STACKIT portal project UUID the plan is part of.
      in: path
      name: projectId
      required: true
      schema:
        format: uuid
        type: string
    get:
      description: List all possible plans for the project.
      operationId: list-plans-project
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/planList'
          description: Successful response with all defined plans.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/badRequest'
          description: Bad request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unauthorizedRequest'
          description: Unauthorized. You may have provided no or wrong credentials.
        '500':
          description: Internal server error. The application experienced some unexpected situation.
      x-stackit-authorization:
        disabled: true
      tags:
      - V1beta1
      summary: List plans project
      x-summary-source: derived
    servers:
    - url: https://edge.api.stackit.cloud
      variables:
        region:
          default: global
  /v1beta1/projects/{projectId}/regions/{regionId}/instances:
    parameters:
    - description: The STACKIT portal project UUID the instance is part of.
      in: path
      name: projectId
      required: true
      schema:
        format: uuid
        type: string
    - description: The STACKIT region the instance is part of.
      example: eu01
      in: path
      name: regionId
      required: true
      schema:
        type: string
    get:
      description: Returns a list of all instances within the project.
      operationId: ListInstances
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/instanceList'
          description: Successful response with all instances.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/badRequest'
          description: Bad request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unauthorizedRequest'
          description: Unauthorized. You may have provided no or wrong credentials.
        '500':
          description: Internal server error. The application experienced some unexpected situation.
      x-stackit-authorization:
        actions:
        - edge.instances.list
        resource-id: projectId
        resource-id-type: dynamic
        resource-type: project
        service-enablement:
          services:
          - cloud.stackit.edge-cloud
      tags:
      - V1beta1
      summary: List instances
      x-summary-source: derived
    post:
      description: Creates a new instance within the project.
      operationId: CreateInstance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInstancePayload'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/instance'
          description: Instance was created successfully
        '400':
          description: Bad Request. Invalid instance name.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unauthorizedRequest'
          description: Unauthorized. You may have provided no or wrong credentials.
        '409':
          description: If two requests try to update the resource at the same time one will succeeded and the other will fail with a 409 Conflict.
        '500':
          description: Internal server error. The application experienced some unexpected situation.
      x-stackit-authorization:
        actions:
        - edge.instances.create
        resource-id: projectId
        resource-id-type: dynamic
        resource-type: project
        service-enablement:
          services:
          - cloud.stackit.edge-cloud
      tags:
      - V1beta1
      summary: Create instance
      x-summary-source: derived
    servers:
    - url: https://edge.api.stackit.cloud
      variables:
        region:
          default: global

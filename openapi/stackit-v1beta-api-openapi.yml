components:
  schemas:
    Quotas:
      description: Quotas holds the specific quota elements for different resources
      properties:
        customRuleGroup:
          $ref: '#/components/schemas/CRGConfigQuota'
        managedRuleSet:
          $ref: '#/components/schemas/MRSConfigQuota'
        webApplicationFirewall:
          $ref: '#/components/schemas/WAFConfigQuota'
      type: object
    GetWAFResponse:
      description: GetWAFResponse returns detailed information about the WAF, which includes the identifying name, references to MRS/CRG and usage.
      properties:
        customRuleGroupName:
          description: Name of the CRG configuration for that WAF.
          example: my-custom-rule-group-config
          pattern: ^[0-9a-z](?:(?:[0-9a-z]|-){0,61}[0-9a-z])?$
          type: string
        labels:
          additionalProperties:
            type: string
          description: 'Labels represent user-defined metadata as key-value pairs.

            Label count should not exceed 64 per WAF.


            **Key Formatting Rules:**

            Length: 1-63 characters.

            Characters: Must begin and end with [a-zA-Z0-9]. May contain dashes (-), underscores (_), dots (.), and alphanumerics in between.

            Keys starting with ''stackit-'' are system-reserved; users MUST NOT manage them.


            **Value Formatting Rules:**

            Length: 0-63 characters (empty string explicitly allowed).

            Characters (for non-empty values): Must begin and end with [a-zA-Z0-9]. May contain dashes (-), underscores (_), dots (.), and alphanumerics in between.

            '
          example:
            cost.center: billing.dept
            environment: prod
            name: my-app
            region: ''
          type: object
        managedRuleSetName:
          description: Name of the managed rule set configuration for that WAF.
          example: my-managed-rule-set-config
          pattern: ^[0-9a-z](?:(?:[0-9a-z]|-){0,61}[0-9a-z])?$
          type: string
        name:
          description: WAF name
          example: my-waf-config
          pattern: ^[0-9a-z](?:(?:[0-9a-z]|-){0,61}[0-9a-z])?$
          type: string
        usage:
          $ref: '#/components/schemas/WAFUsage'
      type: object
    UpdateCustomRuleGroupPayload:
      description: Request payload for updating an existing CRG. Replaces the rules array atomically.
      properties:
        name:
          description: Custom rule group name. Immutable resource key. Provided via URL path.
          example: my-custom-rule-group-config
          pattern: ^[0-9a-z](?:(?:[0-9a-z]|-){0,61}[0-9a-z])?$
          readOnly: true
          type: string
        projectId:
          description: Project identifier
          example: 2438ac3c-37eb-4902-adef-ed16b4431030
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          readOnly: true
          type: string
        region:
          description: Region
          example: eu01
          format: string
          pattern: ^[a-z]{2,4}[0-9]{2}$
          readOnly: true
          type: string
        rules:
          description: The collection of custom rule group SecLang parameters forming this execution group. Replaces the existing rules atomically.
          items:
            $ref: '#/components/schemas/CreateCustomRule'
          type: array
      required:
      - name
      - rules
      type: object
    GetLimitedManagedRuleSetResponse:
      properties:
        name:

components:
  schemas:
    PartialUpdateDatabasePayload:
      properties:
        name:
          $ref: '#/components/schemas/database.name.opt'
        owner:
          $ref: '#/components/schemas/database.owner.opt'
      type: object
    retentionDays:
      description: How long backups are retained. The value can only be between 32 and 90 days.
      example: 35
      format: int32
      maximum: 365
      minimum: 32
      type:
      - integer
      - 'null'
    backup.name:
      description: The name of the backup.
      example: 0000002B0000000000000083
      type: string
    ListRolesResponse:
      properties:
        roles:
          description: List of all role names available in the instance
          example:
          - createdb
          - nocreatedb
          - login
          - nologin
          - createrole
          - nocreaterole
          - replication
          items:
            description: The name of the role
            example: createdb
            type: string
          type: array
      required:
      - roles
      type: object
    flavor.cpu:
      description: The cpu count of the instance.
      example: 1
      format: int64
      type: integer
    GetDatabaseResponse:
      properties:
        id:
          $ref: '#/components/schemas/database.id'
        name:
          $ref: '#/components/schemas/database.name'
        owner:
          $ref: '#/components/schemas/database.owner'
      required:
      - id
      - name
      - owner
      type: object
    instance.isDeletable:
      description: Whether the instance can be deleted or not.
      example: true
      type: boolean
    ListInstance:
      properties:
        id:
          $ref: '#/components/schemas/instance.id'
        isDeletable:
          $ref: '#/components/schemas/instance.isDeletable'
        name:
          $ref: '#/components/schemas/instance.name'
        state:
          $ref: '#/components/schemas/state'
      required:
      - id
      - name
      - state
      - isDeletable
      type: object
    acl:
      description: List of IPV4 cidr.
      example:
      - 198.51.100.0/24
      items:
        description: A IPV4 cidr.
        example: 198.51.100.0/24
        type: string
      type: array
    ListBackupResponse:
      properties:
        backups:
          description: The list containing the information about the backups.
          items:
            $ref: '#/components/schemas/ListBackup'
          type: array
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
      - pagination
      - backups
      type: object
    backup.id:
      description: The ID of the backup.
      example: 123
      format: int64
      type: integer
    CreateInstancePayload:
      properties:
        backupSchedule:
          $ref: '#/components/schemas/backup.schedule'
        encryption:
          $ref: '#/components/schemas/instance.encryption'
        flavorId:
          $ref: '#/components/schemas/flavor.flavorId'
        labels:
          $ref: '#/components/schemas/labels'
        name:
          $ref: '#/components/schemas/instance.name'
        network:
          $ref: '#/components/schemas/instance.network.create'
        retentionDays:
          $ref: '#/components/schemas/retentionDays'
        storage:
          $ref: '#/components/schemas/storage.create'
        version:
          $ref: '#/components/schemas/instance.version'
      required:
      - network
      - backupSchedule
      - flavorId
      - name
      - retentionDays
      - storage
      - version
      type: object
    instance.sort:
      enum:
      - id.desc
      - id.asc
      - is_deletable.desc
      - is_deletable.asc
      - name.asc
      - name.desc
      - state.asc
      - state.desc
      type: string
    database.sort:
      enum:
      - created_at.desc
      - created_at.asc
      - database_id.desc
      - database_id.asc
      - database_name.desc
      - database_name.asc
      - database_owner.desc
      - database_owner.asc
      type: string
    instance.network.update:
      description: The access configuration of the instance
      properties:
        acl:
          $ref: '#/components/schemas/acl'
      required:
      - acl
      type: object
    Error:
      properties:
        code:
          description: The http error code of the error.
          example: 400
          format: int32
          type: integer
        message:
          description: More detailed information about the error.
          example: database not found
          type: string
        traceId:
          description: The trace id of the request.
          example: 58bab3ea361c37c25d72041afdd8aca2
          type: string
        type:
          description: Describes in which state the api was when the error happened.
          example: INTERNAL_ERROR
          type: string
      required:
      - code
      - message
      - type
      - traceId
      type: object
    storage.class:
      description: The storage class for the storage.
      example: premium-perf12-stackit
      type: string
    CloneInstanceResponse:
      properties:
        id:
          $ref: '#/components/schemas/instance.id'
      required:
      - id
      type: object
    UpdateDatabasePayload:
      properties:
        name:
          $ref: '#/components/schemas/database.name'
        owner:
          $ref: '#/components/schemas/database.owner'
      required:
      - name
      - owner
      type: object
    flavor.storageClasses:
      description: maximum storage which can be ordered for the flavor in Gigabyte.
      items:
        $ref: '#/components/schemas/flavor.storageClasses.storageClass'
      type: array
    storage.create:
      description: The object containing information about the storage size and class.
      properties:
        class:
          $ref: '#/components/schemas/storage.class.create'
        size:
          $ref: '#/components/schemas/storage.size.create'
      required:
      - size
      type: object
    backup.schedule.opt:
      description: The schedule for when the database backup will be created. Currently, ONLY daily schedules are supported (every 24 hours). The schedule is written as a cron schedule.
      example: 6 6 * * *
      type: string
    ListFlavors:
      description: The flavor of the instance containing the technical features.
      properties:
        cpu:
          $ref: '#/components/schemas/flavor.cpu'
        description:
          $ref: '#/components/schemas/flavor.description'
        id:
          $ref: '#/components/schemas/flavor.flavorId'
        maxGB:
          $ref: '#/components/schemas/flavor.maxGB'
        memory:
          $ref: '#/components/schemas/flavor.memory'
        minGB:
          $ref: '#/components/schemas/flavor.minGB'
        nodeType:
          $ref: '#/components/schemas/flavor.nodeType'
        storageClasses:
          $ref: '#/components/schemas/flavor.storageClasses'
      required:
      - cpu
      - description
      - id
      - memory
      - nodeType
      - minGB
      - maxGB
      - storageClasses
      type: object
    labels:
      additionalProperties:
        type:
        - string
        - 'null'
      description: 'Key-value pairs, 63 characters max, begin and end with an alphanumerical character,

        may contain dashes (-), underscores (_), dots (.), and alphanumerics between. Key MUST be at least 1 character.

        Max 64 labels

        Regex for keys: ^(?=.{1,63}$)([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9]$

        Regex for values: ^(?=.{0,63}$)(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])*$

        The stackit- prefix is reserved and cannot be used for Keys.

        '
      example:
        key1: value1
        key2: value2
      type: object
    database.owner:
      description: The owner of the database.
      example: MyUser
      type: string
    clone.name.opt:
      description: The name of the cloned instance. If not provided, the default naming behavior of appending '-clone' to the source instance name is used.
      example: my-cloned-instance
      maxLength: 63
      minLength: 3
      type: string
    ListUser:
      properties:
        id:
          $ref: '#/components/schemas/user.id'
        name:
          $ref: '#/components/schemas/user.name'
        state:
          $ref: '#/components/schemas/user.state'
      required:
      - id
      - name
      - state
      type: object
    user.name:
      description: The name of the user.
      example: myUser
      type: string
    instance.encryption:
      description: 'The configuration for instance''s volume and backup storage encryption.


        ⚠️ **Note:** This feature is in private preview. Supplying this object is only permitted for enabled accounts. If your account does not have access, the request will be rejected.

        '
      properties:
        kekKeyId:
          description: The encryption-key key identifier
          example: 48e3f816-3e38-44bb-bbff-22e05f0567de
          type: string
          x-oapi-codegen-extra-tags:
            validate: required,uuid_rfc4122
        kekKeyRingId:
          description: The encryption-key keyring identifier
          example: 48e3f816-3e38-44bb-bbff-22e05f0567de
          type: string
          x-oapi-codegen-extra-tags:
            validate: required,uuid_rfc4122
        kekKeyVersion:
          description: The encryption-key version
          example: '1'
          type: string
          x-oapi-codegen-extra-tags:
            validate: required
        serviceAccount:
          example: example@compute.sa.stackit.cloud
          type: string
          x-oapi-codegen-extra-tags:
            validate: required,email
      required:
      - serviceAccount
      - kekKeyRingId
      - kekKeyId
      - kekKeyVersion
      type: object
    backup.size:
      description: The size of the backup in bytes.
      example: 8394655
      format: int64
      type: integer
    storage.size.create:
